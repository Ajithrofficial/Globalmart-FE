<app-header></app-header>
<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="assets/banners/banner1.svg" class="d-block w-100 banner-img" alt="Global Mart banner">
        </div>
        <div class="carousel-item">
            <img src="assets/banners/banner2.svg" class="d-block w-100 banner-img" alt="Electronics sale">
        </div>
        <div class="carousel-item">
            <img src="assets/banners/banner3.svg" class="d-block w-100 banner-img" alt="Fashion">
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
        data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
        data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>
<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <div class="alert alert-warning text-center" *ngIf="loadError">{{loadError}}</div>
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            <div class="col mb-5" *ngFor="let product of allProducts">
                <div class="card h-100 p-3">
                    <!-- Product image-->
                    <img class="card-img-top product-img" [src]="product.image" alt="{{product.title}}" height="250px"
                        (error)="onImgError($event)" [routerLink]="['/view-product', product.id]" />
                    <!-- Product details-->
                    <div class="card-body p-4">
                        <div class="text-center">
                            <!-- Product name-->
                            <h5 class="fw-bolder">{{product.title.slice(0,20)}}..</h5>
                            <!-- Product price-->
                            ₹{{product.price}}
                        </div>
                    </div>
                    <!-- Product actions-->
                    <div class="d-flex justify-content-between">
                        <a class="btn btn-outline-danger" (click)="addToWishList(product)"><i class="fa-solid fa-heart"></i></a>
                        <a class="btn btn-outline-success" (click)="addToCart(product)"><i class="fa-solid fa-cart-shopping"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<ngx-spinner type="ball-scale-multiple"></ngx-spinner>
